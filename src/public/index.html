<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle Financeiro</h1>
            <p>Educação Financeira e Consumo Consciente (ODS 1 & 12)</p>
        </header>

        <section class="metrics-panel">
            <div class="card">
                <h3>Saldo Total</h3>
                <p id="saldoTotal">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Total de Despesas</h3>
                <p id="totalDespesas">R$ 0,00</p>
            </div>
            <div class="card alert">
                <h3>Gastos por Impulso</h3>
                <p id="totalGastoImpulso">R$ 0,00</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Nova Transação</h2>
            <form id="transacaoForm">
                <div class="input-group">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Conta de Luz">
                </div>

                <div class="input-group">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" required placeholder="0.00">
                </div>

                <div class="input-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" required>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required placeholder="Ex: Moradia, Alimentação">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consumoConsciente" checked>
                    <label for="consumoConsciente">Consumo Consciente (Essencial)?</label>
                    <small>Desmarque se for gasto por impulso.</small>
                </div>

                <button type="submit">Salvar Transação</button>
            </form>
        </section>

        <section class="history-section">
            <h2>Histórico de Transações</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Consciente?</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistorico">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
